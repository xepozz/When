# DigitalOcean App Platform spec (doctl apps create --spec .do/app.yaml)
name: renderkit
services:
  - name: web
    dockerfile_path: app/Dockerfile
    source_dir: app
    github:
      repo: xepozz/When
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_size_slug: basic-s
    instance_count: 1
    health_check:
      http_path: /health
    envs:
      - key: APP_NAME
        value: RenderKit
      - key: APP_URL
        value: ${APP_URL}
      - key: SESSION_SECRET
        type: SECRET
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      - key: STRIPE_PRICE_STARTER
      - key: STRIPE_PRICE_PRO
      - key: STRIPE_PRICE_BUSINESS
      - key: DATABASE_PATH
        value: /data/renderkit.db
