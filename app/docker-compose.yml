services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    # Chromium needs a bit of shared memory for big pages
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 2g
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  data:
  caddy_data:
  caddy_config:
