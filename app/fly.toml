# Fly.io: `fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly secrets set SESSION_SECRET=$(openssl rand -hex 32) STRIPE_SECRET_KEY=... && fly deploy`
app = "renderkit"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "RenderKit"
  DATABASE_PATH = "/data/renderkit.db"
  RENDER_CONCURRENCY = "2"
  PORT = "3000"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
